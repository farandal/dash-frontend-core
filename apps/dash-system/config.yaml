APP_NAME: "kitchntabs"
WS_HOST: "ws.dashadmin.cl"
WS_PORT: ""
WS_SCHEME: "https"
API_HOST: "api.dashadmin.cl"
API_PORT: ""
API_SCHEME: "https"
APP: "dash"

AUTH_ENDPOINT: "api/ws/auth"

SPAWN_BACKGROUND_SERVICE: true
DEV_PYTHON_ENV: "../../../dash-python-service/pw_env/bin/python3.9"
PYTHON_SERVICE_PATH_DEV: "../../../dash-python-service/src/kt_service.py"
PRINT_SERVICE_PATH_DEV: "../../../dash-python-service/src/print_service.py"
PYTHON_SERVICE_PATH_PROD: "./python-service/kt_service"
PRINT_SERVICE_PATH_PROD: "./python-service/print_service"
SPEECH_SERVICE_PATH_DEV: "../../../dash-python-service/src/tts_service.py"
SPEECH_SERVICE_PATH_PROD: "./python-service/tts_service"

# Poppler path for PDF conversion
# Windows: C:\poppler-24.08.0\Library\bin
# Linux/Mac: Leave empty (uses system poppler-utils)
POPPLER_PATH: ""

# Printer USB IDs
# EPSON TM-m30: VENDOR=0x04b8, PRODUCT=0x0e20
# POS58/PT-210: VENDOR=0x0FE6, PRODUCT=0x811E
PRINTER_VENDOR: 0x0FE6
PRINTER_PRODUCT: 0x811E
PRINTER_MAX_WIDTH: 384

# Linux device path (for direct file printing)
PRINTER_DEVICE_PATH: "/dev/usb/lp0"
# CUPS printer name (leave empty to use default, or set specific printer name)
PRINTER_NAME: ""

LIBUSB_PATH: ""
WKHTMLTOPDF_PATH: ""
ACROBAT_PATH: ""
GOOGLE_MAPS_API_KEY: ""
JUMPSELLER_SECRET_KEY: ""
TWILIO_ID: ""
TWILIO_TOKEN: ""

# Speech/TTS Messages
SPEECH_WELCOME_MESSAGE: "Bienvenido a Kitchen Tabs"
SPEECH_CONNECTED_MESSAGE: "Conectado al servidor"
SPEECH_DISCONNECTED_MESSAGE: "Desconectado del servidor"
SPEECH_LANGUAGE: "es"