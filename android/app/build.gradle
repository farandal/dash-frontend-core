plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace "com.kitchntabs.app"
    compileSdk rootProject.ext.compileSdkVersion

/*
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(23)
        }
    }

*/

    defaultConfig {
        applicationId "com.kitchntabs.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "internal-preview-15"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('KITCHNTABS_RELEASE_STORE_FILE')) {
                storeFile file(KITCHNTABS_RELEASE_STORE_FILE)
                storePassword KITCHNTABS_RELEASE_STORE_PASSWORD
                keyAlias KITCHNTABS_RELEASE_KEY_ALIAS
                keyPassword KITCHNTABS_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Enable native debug symbols
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}
/*
repositories {
    flatDir{
    }
}
*/

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    
    // Firebase - Updated BoM version, removed explicit versions
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.pusher:push-notifications-android:1.9.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Custom AAB naming
tasks.whenTaskAdded { task ->
    if (task.name == 'bundleRelease') {
        task.doLast {
            def appName = "KitchnTabs"
            def versionName = android.defaultConfig.versionName
            def date = new Date().format('yyyy-MM-dd_HH-mm')
            def originalFile = file("${buildDir}/outputs/bundle/release/app-release.aab")
            def newFile = file("${buildDir}/outputs/bundle/release/${appName}-v${versionName}-${date}.aab")
            
            if (originalFile.exists()) {
                originalFile.renameTo(newFile)
                println "✅ AAB renamed to: ${newFile.name}"
            }
        }
    }
}
